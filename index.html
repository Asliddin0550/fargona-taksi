<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farg'ona - Shohimard on Taksi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .hero { background: linear-gradient(135deg, #ef4444, #f97316); }
    .field { transition: all 0.3s ease; }
    .field:focus { transform: scale(1.02); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.3); }
    
    .toast { position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 12px; color: white; font-weight: bold; z-index: 2000; animation: slideIn 0.3s ease; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body class="bg-gradient-to-b from-purple-700 to-purple-900 min-h-screen pb-12">
  <!-- Header -->
  <div class="hero text-white py-8 text-center">
    <div class="max-w-md mx-auto px-4">
      <div class="flex justify-center mb-3">
        <i class="fa-solid fa-car-side text-5xl"></i>
      </div>
      <h1 class="text-3xl font-bold">Farg'ona - Shohimard on Taksi</h1>
      <p class="mt-2 text-sm opacity-90">Tez • Ishonchli • Qulay narxlarda</p>
      <p class="mt-4 text-lg font-medium">📞 +998 33 835 11 87</p>
    </div>
  </div>

  <div class="max-w-md mx-auto mt-8 px-4">
    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
      <form id="taxiForm" class="p-6 space-y-6" novalidate>
        <div>
          <label class="block text-xs font-bold text-blue-700 mb-1.5">📍 QAYERDAN</label>
          <select id="from" required class="field field-blue w-full rounded-2xl px-5 py-4 text-gray-800 font-semibold">
            <option value="">Tanlang</option>
            <option value="Shohimard on">Shohimard on</option>
            <option value="Farg'ona shahri">Farg'ona shahri</option>
            <option value="Marg'ilon">Marg'ilon</option>
            <option value="Qo'qon">Qo'qon</option>
            <option value="Rishton">Rishton</option>
            <option value="Quva">Quva</option>
            <option value="Toshloq">Toshloq</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-green-700 mb-1.5">🎯 QAYERGA</label>
          <select id="to" required class="field field-green w-full rounded-2xl px-5 py-4 text-gray-800 font-semibold">
            <option value="">Tanlang</option>
            <option value="Shohimard on">Shohimard on</option>
            <option value="Farg'ona shahri">Farg'ona shahri</option>
            <option value="Marg'ilon">Marg'ilon</option>
            <option value="Qo'qon">Qo'qon</option>
            <option value="Toshkent">Toshkent</option>
            <option value="Toshloq">Toshloq</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-yellow-700 mb-1.5">👥 NECHA KISHI?</label>
          <input type="number" id="people" placeholder="Masalan: 3" required min="1" 
            class="field field-yellow w-full rounded-2xl px-5 py-4 text-gray-800 font-semibold">
        </div>

        <div>
          <label class="block text-xs font-bold text-pink-700 mb-1.5">📅 KETISH SANASI</label>
          <input type="date" id="date" required 
            class="field field-pink w-full rounded-2xl px-5 py-4 text-gray-800 font-semibold">
        </div>

        <div>
          <label class="block text-xs font-bold text-purple-700 mb-1.5">⏰ KETISH VAQTI</label>
          <input type="text" id="time" placeholder="14:30 yoki 2:30 PM" required
            class="field field-purple w-full rounded-2xl px-5 py-4 text-gray-800 font-semibold">
        </div>

        <div>
          <label class="block text-xs font-bold text-orange-700 mb-1.5">🚗 MASHINA TURI</label>
          <select id="car" required class="field field-orange w-full rounded-2xl px-5 py-4 text-gray-800 font-semibold">
            <option value="">Tanlang</option>
            <option value="Yengil avtomobil">Yengil avtomobil</option>
            <option value="Damas">Damas</option>
            <option value="Lacetti">Lacetti</option>
            <option value="JAK 10-15 kishili">JAK 10-15 kishili</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-red-700 mb-1.5">📞 TELEFON RAQAM</label>
          <input type="tel" id="phone" placeholder="+998 90 123 45 67" required
            class="field field-red w-full rounded-2xl px-5 py-4 text-gray-800 font-semibold">
          <p class="text-xs text-red-600 mt-1 ml-2">ℹ️ +998 bilan boshlanishi shart emas</p>
        </div>

        <button type="submit" id="submitBtn"
          class="w-full bg-gradient-to-r from-red-500 to-orange-500 hover:from-red-600 hover:to-orange-600 text-white font-bold py-5 rounded-2xl text-lg flex items-center justify-center gap-2 shadow-lg transform transition hover:scale-105 active:scale-95">
          <i class="fa-solid fa-paper-plane"></i> BUYURTMA YUBORISH
        </button>
      </form>
    </div>
  </div>

  <!-- Admin Panel (oldingi kabi qoldirildi) -->
  <!-- ... (admin modal va panel kodini oldingi versiyadan ko'chirib qo'ying) ... -->

  <script>
    const BOT_TOKEN = "8202225710:AAFeDmr0Jp1-WOvo234hFZeQtk_-qkMytzs";
    const GROUP_ID = "-1003952071411";   // ← To'g'ri ID

    const ADMIN_PASSWORD = "Asliddin0550";
    const SECRET_CODE = "0550";

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
      toast.innerHTML = `<i class="fa-solid fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'} mr-2"></i> ${message}`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      return `${day}.${month}.${year}`;
    }

    function formatPhone(phone) {
      return phone.replace(/\D/g, '');
    }

    function isValidPhone(phone) {
      const cleaned = formatPhone(phone);
      return cleaned.length >= 9;
    }

    function getTodayDate() {
      return new Date().toISOString().split('T')[0];
    }

    // Form submit
    document.getElementById("taxiForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const phone = document.getElementById("phone").value.trim();
      if (!isValidPhone(phone)) {
        showToast("❌ Telefon raqamni to'g'ri kiriting!", 'error');
        return;
      }

      const data = {
        from: document.getElementById("from").value,
        to: document.getElementById("to").value,
        people: document.getElementById("people").value,
        date: formatDate(document.getElementById("date").value),
        dateRaw: document.getElementById("date").value,
        time: document.getElementById("time").value.trim(),
        car: document.getElementById("car").value,
        phone: phone,
        timestamp: new Date().toISOString()
      };

      const message = `🚖 <b>YANGI BUYURTMA!</b> 🚖\n\n` +
        `📍 <b>Qayerdan:</b> <code>${data.from}</code>\n` +
        `🎯 <b>Qayerga:</b> <code>${data.to}</code>\n` +
        `👥 <b>Kishi soni:</b> <b>${data.people}</b> nafar\n` +
        `📅 <b>Sana:</b> <b>${data.date}</b>\n` +
        `⏰ <b>Vaqt:</b> <b>${data.time}</b>\n` +
        `🚗 <b>Mashina:</b> <code>${data.car}</code>\n` +
        `📞 <b>Telefon:</b> <a href="tel:${data.phone}">${data.phone}</a>\n\n` +
        `━━━━━━━━━━━━━━━━━\n` +
        `💰 To'lov: Naqd yoki Karta\n` +
        `✅ Buyurtma qabul qilindi!`;

      try {
        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Yuborilmoqda...';

        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: GROUP_ID,
            text: message,
            parse_mode: "HTML"
          })
        });

        const result = await response.json();

        if (result.ok) {
          showToast("✅ Buyurtma muvaffaqiyatli yuborildi!", 'success');
          document.getElementById("taxiForm").reset();
        } else {
          showToast("❌ Xatolik: " + (result.description || "Noma'lum xatolik"), 'error');
        }
      } catch (error) {
        showToast("❌ Internet aloqasi yo'q. Keyinroq urinib ko'ring.", 'error');
        console.error(error);
      } finally {
        const btn = document.getElementById("submitBtn");
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> BUYURTMA YUBORISH';
      }
    });

    // Sana uchun bugungi kunni cheklash
    document.getElementById("date").min = getTodayDate();

    // Admin panel kodi (oldingi versiyadan qoldiring)
    // ... Admin panel scriptini qo'shishingiz mumkin ...

  </script>
</body>
</html>
