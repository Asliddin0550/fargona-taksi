<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farg'ona - Shohimardon Taksi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .hero { background: linear-gradient(135deg, #2563eb, #7c3aed); }
    .field { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .field:focus { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.2); }
    
    .toast { position: fixed; top: 20px; right: 20px; padding: 16px 24px; border-radius: 16px; color: white; font-weight: 600; z-index: 3000; animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); backdrop-filter: blur(8px); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    
    .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; transition: color 0.3s; }
    .field:focus + .input-icon, .field:focus ~ .input-icon { color: #6366f1; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen pb-12">

  <!-- Header -->
  <div class="hero text-white py-10 text-center shadow-2xl shadow-indigo-500/30 relative overflow-hidden">
    <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4xKSIvPjwvc3ZnPg==')] opacity-30"></div>
    <div class="max-w-md mx-auto px-4 relative z-10">
      <div class="flex justify-center mb-4">
        <div class="bg-white/20 p-4 rounded-full backdrop-blur-sm">
          <i class="fa-solid fa-taxi text-5xl text-white"></i>
        </div>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight">Farg'ona - Shohimardon</h1>
      <p class="mt-2 text-sm font-medium text-indigo-100 uppercase tracking-wider">Tez • Ishonchli • Qulay</p>
      <a href="tel:+998338351187" class="mt-5 inline-flex items-center gap-2 bg-white/20 hover:bg-white/30 backdrop-blur-md px-5 py-2.5 rounded-full transition-all border border-white/30">
        <i class="fa-solid fa-phone-volume text-yellow-300"></i>
        <span class="font-bold text-lg">+998 33 835 11 87</span>
      </a>
    </div>
  </div>

  <!-- Asosiy Forma -->
  <div class="max-w-md mx-auto mt-[-30px] px-4 relative z-20">
    <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl shadow-black/40 overflow-hidden border border-white/20">
      <form id="taxiForm" class="p-6 space-y-5" novalidate>
        
        <!-- Qayerdan -->
        <div class="relative">
          <label class="block text-xs font-bold text-indigo-700 mb-1.5 ml-1">📍 QAYERDAN</label>
          <div class="relative">
            <select id="from" required class="field w-full rounded-2xl pl-12 pr-5 py-4 text-gray-800 font-semibold bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none appearance-none cursor-pointer">
              <option value="">Manzilni tanlang</option>
              <option value="Shohimardon">Shohimardon</option>
              <option value="Farg'ona shahri">Farg'ona shahri</option>
              <option value="Marg'ilon">Marg'ilon</option>
              <option value="Qo'qon">Qo'qon</option>
              <option value="Rishton">Rishton</option>
              <option value="Quva">Quva</option>
              <option value="Toshloq">Toshloq</option>
            </select>
            <i class="fa-solid fa-location-dot input-icon"></i>
            <i class="fa-solid fa-chevron-down absolute right-5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
          </div>
        </div>

        <!-- Qayerga -->
        <div class="relative">
          <label class="block text-xs font-bold text-emerald-700 mb-1.5 ml-1">🎯 QAYERGA</label>
          <div class="relative">
            <select id="to" required class="field w-full rounded-2xl pl-12 pr-5 py-4 text-gray-800 font-semibold bg-slate-50 border border-slate-200 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none appearance-none cursor-pointer">
              <option value="">Manzilni tanlang</option>
              <option value="Shohimardon">Shohimardon</option>
              <option value="Farg'ona shahri">Farg'ona shahri</option>
              <option value="Marg'ilon">Marg'ilon</option>
              <option value="Qo'qon">Qo'qon</option>
              <option value="Toshkent">Toshkent</option>
              <option value="Toshloq">Toshloq</option>
            </select>
            <i class="fa-solid fa-flag-checkered input-icon"></i>
            <i class="fa-solid fa-chevron-down absolute right-5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
          </div>
        </div>

        <!-- Kishi soni va Mashina turi (yonma-yon) -->
        <div class="grid grid-cols-2 gap-4">
          <div class="relative">
            <label class="block text-xs font-bold text-amber-700 mb-1.5 ml-1">👥 NECHA KISHI?</label>
            <div class="relative">
              <input type="number" id="people" placeholder="3" required min="1" 
                class="field w-full rounded-2xl pl-12 pr-5 py-4 text-gray-800 font-semibold bg-slate-50 border border-slate-200 focus:border-amber-500 focus:ring-4 focus:ring-amber-500/10 outline-none">
              <i class="fa-solid fa-users input-icon"></i>
            </div>
          </div>
          <div class="relative">
            <label class="block text-xs font-bold text-purple-700 mb-1.5 ml-1">🚗 MASHINA</label>
            <div class="relative">
              <select id="car" required class="field w-full rounded-2xl pl-12 pr-5 py-4 text-gray-800 font-semibold bg-slate-50 border border-slate-200 focus:border-purple-500 focus:ring-4 focus:ring-purple-500/10 outline-none appearance-none cursor-pointer">
                <option value="">Tanlang</option>
                <option value="Yengil avtomobil">Yengil avtomobil</option>
                <option value="Damas">Damas</option>
                <option value="Lacetti">Lacetti</option>
                <option value="JAK (10-15 kishili)">JAK (10-15 kishili)</option>
              </select>
              <i class="fa-solid fa-car input-icon"></i>
              <i class="fa-solid fa-chevron-down absolute right-5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
            </div>
          </div>
        </div>

        <!-- Sana va Vaqt (Oddiy text) -->
        <div class="grid grid-cols-2 gap-4">
          <div class="relative">
            <label class="block text-xs font-bold text-rose-700 mb-1.5 ml-1">📅 KETISH SANASI</label>
            <div class="relative">
              <input type="text" id="date" placeholder="15.09.2026 yoki Ertaga" required
                class="field w-full rounded-2xl pl-12 pr-5 py-4 text-gray-800 font-semibold bg-slate-50 border border-slate-200 focus:border-rose-500 focus:ring-4 focus:ring-rose-500/10 outline-none">
              <i class="fa-regular fa-calendar input-icon"></i>
            </div>
          </div>
          <div class="relative">
            <label class="block text-xs font-bold text-cyan-700 mb-1.5 ml-1">⏰ KETISH VAQTI</label>
            <div class="relative">
              <input type="text" id="time" placeholder="14:30 yoki Tushdan keyin" required
                class="field w-full rounded-2xl pl-12 pr-5 py-4 text-gray-800 font-semibold bg-slate-50 border border-slate-200 focus:border-cyan-500 focus:ring-4 focus:ring-cyan-500/10 outline-none">
              <i class="fa-regular fa-clock input-icon"></i>
            </div>
          </div>
        </div>

        <!-- Telefon raqam -->
        <div class="relative">
          <label class="block text-xs font-bold text-slate-700 mb-1.5 ml-1">📞 TELEFON RAQAM</label>
          <div class="relative">
            <input type="tel" id="phone" placeholder="90 123 45 67" required
              class="field w-full rounded-2xl pl-12 pr-5 py-4 text-gray-800 font-semibold bg-slate-50 border border-slate-200 focus:border-slate-500 focus:ring-4 focus:ring-slate-500/10 outline-none">
            <i class="fa-solid fa-phone input-icon"></i>
          </div>
          <p class="text-xs text-slate-500 mt-1.5 ml-1 flex items-center gap-1">
            <i class="fa-solid fa-circle-info text-slate-400"></i> Raqamni 90 123 45 67 ko'rinishida kiriting
          </p>
        </div>

        <!-- Yuborish tugmasi -->
        <button type="submit" id="submitBtn"
          class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-4.5 rounded-2xl text-lg flex items-center justify-center gap-3 shadow-xl shadow-indigo-500/30 transform transition-all hover:scale-[1.02] active:scale-95 mt-2">
          <i class="fa-solid fa-paper-plane"></i> BUYURTMA YUBORISH
        </button>
      </form>
    </div>
    
    <p class="text-center text-slate-400 text-xs mt-6">© 2026 Farg'ona - Shohimardon Taksi Xizmati</p>
  </div>

  <script>
    // Yangilangan ma'lumotlar
    const BOT_TOKEN = "8202225710:AAFh-K84kNXmflX0uNy9P8TX6CqpMSckhoQ";
    const GROUP_ID = "-1004354232554";

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
      toast.innerHTML = `<i class="fa-solid fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'} mr-2"></i> ${message}`;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => toast.remove(), 400);
      }, 4000);
    }

    function formatPhone(phone) {
      return phone.replace(/\D/g, '');
    }

    function isValidPhone(phone) {
      const cleaned = formatPhone(phone);
      return cleaned.length >= 9 && cleaned.length <= 12;
    }

    // Formani yuborish
    document.getElementById("taxiForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const phoneInput = document.getElementById("phone").value.trim();
      if (!isValidPhone(phoneInput)) {
        showToast("❌ Telefon raqamni to'g'ri kiriting (masalan: 901234567)!", 'error');
        return;
      }

      const fromVal = document.getElementById("from").value;
      const toVal = document.getElementById("to").value;
      
      if (fromVal === toVal) {
        showToast("❌ Qayerdan va qayerga bir xil bo'lishi mumkin emas!", 'error');
        return;
      }

      const cleanedPhone = formatPhone(phoneInput);
      const displayPhone = cleanedPhone.startsWith('998') ? cleanedPhone : '998' + cleanedPhone;

      // Sana va vaqtni to'g'ridan-to'g'ri matn sifatida olamiz
      const dateVal = document.getElementById("date").value.trim();
      const timeVal = document.getElementById("time").value.trim();

      const message = `🚖 <b>YANGI BUYURTMA!</b> 🚖\n\n` +
        `📍 <b>Qayerdan:</b> <code>${fromVal}</code>\n` +
        `🎯 <b>Qayerga:</b> <code>${toVal}</code>\n` +
        `👥 <b>Kishi soni:</b> <b>${document.getElementById("people").value}</b> nafar\n` +
        `📅 <b>Sana:</b> <b>${dateVal}</b>\n` +
        `⏰ <b>Vaqt:</b> <b>${timeVal}</b>\n` +
        `🚗 <b>Mashina:</b> <code>${document.getElementById("car").value}</code>\n` +
        `📞 <b>Telefon:</b> <a href="tel:+${displayPhone}">+${displayPhone}</a>\n\n` +
        `━━━━━━━━━━━━━━━━━\n` +
        `💰 To'lov: Naqd yoki Karta\n` +
        `✅ Buyurtma qabul qilindi!`;

      try {
        const btn = document.getElementById("submitBtn");
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Yuborilmoqda...';
        btn.classList.add('opacity-80');

        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: GROUP_ID,
            text: message,
            parse_mode: "HTML"
          })
        });

        const result = await response.json();

        if (result.ok) {
          showToast("✅ Buyurtma muvaffaqiyatli yuborildi!", 'success');
          document.getElementById("taxiForm").reset();
        } else {
          showToast("❌ Xatolik: " + (result.description || "Noma'lum xatolik"), 'error');
        }
      } catch (error) {
        showToast("❌ Internet aloqasi yo'q. Keyinroq urinib ko'ring.", 'error');
        console.error(error);
      } finally {
        const btn = document.getElementById("submitBtn");
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> BUYURTMA YUBORISH';
        btn.classList.remove('opacity-80');
      }
    });
  </script>
</body>
</html>
